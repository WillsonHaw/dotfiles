[shell.panel]
transparency_mode = "glass"

[theme]
source = "wallpaper"

[wallpaper]
fill_mode = "crop"

    [wallpaper.default]
    path = "/tmp/noctalia-wallpapers/q265xq.png"

    [wallpaper.last]
    path = "/tmp/noctalia-wallpapers/q265xq.png"

    [wallpaper.monitors.DP-8]
    path = "/tmp/noctalia-wallpapers/8gdo51.png"

    [wallpaper.monitors.DP-9]
    path = "/tmp/noctalia-wallpapers/q265xq.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/slumpy/Wallpapers/sfw/oxljkp.jpg"

[widget.battery]
hide_when_plugged = true

[widget.network]
show_label = false

[widget.tailscale]
type = "slumpy/tailscale:tailscale"

[widget.tray]
anchor = true
hide_passive = false

[widget.volume]
show_label = false

[widget.wallhaven]
type = "slumpy/wallhaven:wallhaven"

[widget.waynergy]
type = "slumpy/waynergy:waynergy"